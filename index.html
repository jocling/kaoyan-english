  const payload = { app: '英二阅读台', exportedAt: new Date().toISOString(), count: list.length, attempts: list };
  const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const d = new Date(); a.download = `英二阅读记录_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(`已导出 ${list.length} 条记录`);
}
function importFiles(files){
  let n = 0, pending = files.length;
  [...files].forEach(f => { const r = new FileReader(); r.onload = () => { try{ const j = JSON.parse(r.result); const arr = Array.isArray(j) ? j : (j.attempts || (j.id ? [j] : [])); arr.forEach(a => { if(a && a.id && a.textId){ attempts[a.id] = a; n++; } }); }catch(e){} if(--pending === 0){ persist(); render(); toast(`已导入 ${n} 条记录`); } }; r.readAsText(f); });
}
function attemptMarkdown(a){
  const t = byId[a.textId]; if(!t) return '';
  const lines = [`## ${a.label} · ${fmtDate(a.submittedAt)}`, ``, `- 得分：${a.score}/5　用时：${fmt(a.durationSec)}${a.durationSec > LIMIT ? '（超 18 分钟）' : ''}`, `- 标记：${a.words.length} 个词，${a.sentences.length} 句`];
  if(a.note) lines.push(`- 备注：${a.note}`);
  lines.push(``, `### 答题`);
  t.questions.forEach(q => { const ok = a.correct[q.n]; lines.push(`- ${q.n}. ${ok ? '✓' : '✗'} 选 ${a.answers[q.n] || '—'} / 答案 ${q.answer}${a.qTimes && a.qTimes[q.n] != null ? `　第 ${fmt(a.qTimes[q.n])} 作答` : ''}${!ok && a.causes && a.causes[q.n] ? `　错因：${a.causes[q.n]}` : ''}${!ok ? `\n  - ${q.stem}` : ''}`); });
  if(a.words.length){ lines.push(``, `### 不认识的词`); a.words.forEach(w => lines.push(`- **${w.w}** — ${w.sent}`)); }
  if(a.sentences.length){ lines.push(``, `### 没读懂的句子`); a.sentences.forEach(s => lines.push(`- （第 ${s.p + 1} 段）${s.text}`)); }
  return lines.join('\n');
}
async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); toast('已复制，可以直接贴给 AI'); }catch(e){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('已复制'); }catch(_){ toast('复制失败'); } ta.remove(); } }
document.getElementById('btn-export').addEventListener('click', exportAll);
document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-import').click());
document.getElementById('file-import').addEventListener('change', e => { importFiles(e.target.files); e.target.value = ''; });

const ABBR = /(^|\s)(Mr|Mrs|Ms|Dr|Prof|St|Jr|Sr|vs|No|Jan|Feb|Aug|Sept|Oct|Nov|Dec|U\.S|U\.K|e\.g|i\.e|etc|Inc|Co)\.$/;
function splitSentences(p){
  const toks = p.split(' ');
  const out = []; let cur = [];
  toks.forEach((t, i) => {
    cur.push(t);
    const next = toks[i + 1];
    const ends = /[.!?]["'”’)\]]*$/.test(t);
    const abbr = ABBR.test(t) || /^[A-Z]\.$/.test(t) || /^[A-Z]\.["'”’]?$/.test(t);
    const nextCap = next === undefined || /^["'“‘(\[]?[A-Z0-9$]/.test(next);
    if(ends && !abbr && nextCap){ out.push(cur.join(' ')); cur = []; }
  });
  if(cur.length) out.push(cur.join(' '));
  return out;
}
const clean = w => w.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, '').toLowerCase();
function fmt(sec){ sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }
function fmtDate(iso){ const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
let toastT; function toast(m){ const el = document.getElementById('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }

// render passage into container; marks: {words:Set('p:s:w'), sents:Set('p:s')}
function renderPassage(el, text, marks){
  el.innerHTML = '';
  text.paragraphs.forEach((para, pi) => {
    const p = document.createElement('p');
    splitSentences(para).forEach((sent, si) => {
      const s = document.createElement('span'); s.className = 's'; s.dataset.k = pi + ':' + si;
      if(marks.sents.has(s.dataset.k)) s.classList.add('hard');
      const dot = document.createElement('button'); dot.className = 'dot'; dot.setAttribute('aria-label', '标记这句没读懂'); s.appendChild(dot);
      sent.split(' ').forEach((tok, wi) => {
        const w = document.createElement('span'); w.className = 'w'; w.textContent = tok; w.dataset.k = pi + ':' + si + ':' + wi; w.dataset.w = clean(tok);
        if(marks.words.has(w.dataset.k)) w.classList.add('unk');
        s.appendChild(w); s.appendChild(document.createTextNode(' '));
      });
      p.appendChild(s);
    });
    el.appendChild(p);
  });
}

// ---------- views ----------
const views = ['home','exam','history','detail','vocab'];
function show(v){ views.forEach(x => document.getElementById('view-' + x).classList.toggle('hide', x !== v)); document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === (v === 'exam' ? 'home' : v === 'detail' ? 'history' : v)))); window.scrollTo(0,0); }
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { if(cur && cur.started && !cur.submitted && !confirm('这篇还没提交，离开会丢掉本次作答。确定离开？')) return; if(cur && !cur.submitted) cur = null; show(b.dataset.tab); render(); }));

function attemptsFor(id){ return Object.values(attempts).filter(a => a.textId === id).sort((a,b) => a.submittedAt < b.submittedAt ? 1 : -1); }
function scorePill(a){ const c = a.score; const cls = c >= 4 ? 'ok' : c >= 3 ? 'mid' : 'bad'; return `<span class="pill ${cls}">${c}/5</span>`; }

function renderHome(){
  const box = document.getElementById('years'); box.innerHTML = '';
  DATA.forEach(y => {
    const sec = document.createElement('div'); sec.className = 'year';
    sec.innerHTML = `<h3>${y.year} 年</h3>`;
    const list = document.createElement('div'); list.className = 'tlist';
    y.texts.forEach(t => {
      const done = attemptsFor(t.id);
      const b = document.createElement('button'); b.className = 'tcard';
      b.innerHTML = `<span class="lbl">Text ${t.id.split('-')[1]}</span><span class="lead">${esc(t.paragraphs[0].slice(0, 110))}…</span><span class="st">${done.length ? scorePill(done[0]) + `<span class="num">${fmt(done[0].durationSec)}</span><span>${fmtDate(done[0].submittedAt)}</span>` : '<span class="pill todo">未做</span>'}</span>`;
      b.addEventListener('click', () => openExam(t.id));
      list.appendChild(b);
    });
    sec.appendChild(list); box.appendChild(sec);
  });
}

// ---------- exam ----------
let cur = null, tick = null;
function openExam(id){
  const t = byId[id];
  cur = { text: t, started: false, submitted: false, startedAt: null, words: new Set(), sents: new Set(), answers: {}, qTimes: {}, causes: {}, note: '' };
  document.getElementById('exam-label').textContent = t.label;
  document.getElementById('timer').textContent = '00:00'; document.getElementById('timer').classList.remove('over');
  document.getElementById('btn-start').classList.remove('hide'); document.getElementById('btn-submit').classList.add('hide');
  document.getElementById('result').classList.add('hide');
  const pEl = document.getElementById('passage'); pEl.classList.add('locked'); renderPassage(pEl, t, cur);
  renderQs(document.getElementById('qs'), t, null, true);
  show('exam');
}
function renderQs(el, t, done, interactive){
  el.innerHTML = '';
  t.questions.forEach(q => {
    const d = document.createElement('div'); d.className = 'q' + (interactive ? ' locked' : '');
    d.dataset.n = q.n;
    const chosen = done ? done.answers[q.n] : null;
    d.innerHTML = `<div class="stem"><b>${q.n}</b>${esc(q.stem)}</div><div class="opts">${['A','B','C','D'].map(k => {
      let cls = 'opt';
      if(done){ if(k === q.answer) cls += ' right'; else if(k === chosen) cls += ' wrong'; }
      return `<button class="${cls}" data-k="${k}"><i>${k}</i><span>${esc(q.options[k])}</span></button>`; }).join('')}</div>` +
      (done ? `<div class="qmeta"><span>你选 ${chosen || '—'} · 答案 ${q.answer}</span>${done.qTimes && done.qTimes[q.n] != null ? `<span class="num">第 ${fmt(done.qTimes[q.n])} 作答</span>` : ''}${done.causes && done.causes[q.n] ? `<span class="chip on">${done.causes[q.n]}</span>` : ''}</div>` : '');
    if(interactive){
      d.querySelectorAll('.opt').forEach(o => o.addEventListener('click', () => {
        if(!cur || !cur.started || cur.submitted) return;
        d.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); o.classList.add('sel');
        cur.answers[q.n] = o.dataset.k;
        if(cur.qTimes[q.n] == null) cur.qTimes[q.n] = elapsed();
        document.getElementById('btn-submit').disabled = Object.keys(cur.answers).length < 5;
      }));
    }
    el.appendChild(d);
  });
}
function elapsed(){ return (Date.now() - cur.startedAt) / 1000; }
document.getElementById('btn-start').addEventListener('click', () => {
  cur.started = true; cur.startedAt = Date.now();
  document.getElementById('passage').classList.remove('locked');
  document.querySelectorAll('#qs .q').forEach(q => q.classList.remove('locked'));
  document.getElementById('btn-start').classList.add('hide');
  const sb = document.getElementById('btn-submit'); sb.classList.remove('hide'); sb.disabled = true;
  tick = setInterval(() => { const e = elapsed(); const tm = document.getElementById('timer'); tm.textContent = fmt(e); tm.classList.toggle('over', e > LIMIT); }, 500);
});
document.getElementById('passage').addEventListener('click', e => {
  if(!cur || !cur.started || cur.submitted) return;
  const w = e.target.closest('.w'); const dot = e.target.closest('.dot');
  if(dot){ const s = dot.parentElement; s.classList.toggle('hard'); cur.sents.has(s.dataset.k) ? cur.sents.delete(s.dataset.k) : cur.sents.add(s.dataset.k); return; }
  if(w && w.dataset.w){ w.classList.toggle('unk'); cur.words.has(w.dataset.k) ? cur.words.delete(w.dataset.k) : cur.words.add(w.dataset.k); }
});
document.getElementById('btn-submit').addEventListener('click', () => {
  if(!cur || cur.submitted) return;
  clearInterval(tick); cur.submitted = true; cur.durationSec = elapsed();
  document.getElementById('btn-submit').classList.add('hide');
  const t = cur.text; let score = 0; const correct = {};
  t.questions.forEach(q => { correct[q.n] = cur.answers[q.n] === q.answer; if(correct[q.n]) score++; });
  cur.score = score; cur.correct = correct;
  // lock options and show right/wrong
  document.querySelectorAll('#qs .q').forEach(d => {
    const q = t.questions.find(x => x.n == d.dataset.n); d.classList.add('locked');
    d.querySelectorAll('.opt').forEach(o => { o.classList.remove('sel'); if(o.dataset.k === q.answer) o.classList.add('right'); else if(o.dataset.k === cur.answers[q.n]) o.classList.add('wrong'); });
    const meta = document.createElement('div'); meta.className = 'qmeta';
    meta.innerHTML = `<span>你选 ${cur.answers[q.n]} · 答案 ${q.answer}</span>` + (correct[q.n] ? '' : `<span class="chips">${CAUSES.map(c => `<button class="chip" data-c="${c}">${c}</button>`).join('')}</span>`);
    meta.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => { meta.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); ch.classList.add('on'); cur.causes[q.n] = ch.dataset.c; }));
    d.appendChild(meta);
  });
  // result panel
  const words = [...cur.words].map(k => document.querySelector(`#passage .w[data-k="${k}"]`)).filter(Boolean);
  const r = document.getElementById('result'); r.classList.remove('hide');
  r.innerHTML = `<div><span class="score">${score}<span class="muted" style="font-size:16px"> / 5</span></span> <span class="muted num" style="margin-left:12px">用时 ${fmt(cur.durationSec)}${cur.durationSec > LIMIT ? ' · 超过 18 分钟' : ''}</span></div>
    <div class="small muted">标了 ${cur.words.size} 个词、${cur.sents.size} 句。错的题在右边点一下错因，再写一句话（可空），然后保存。</div>
    ${words.length ? `<div class="wlist">${words.map(w => `<span class="wtag">${esc(w.dataset.w)}</span>`).join('')}</div>` : ''}
    <textarea id="note" placeholder="一句话：这篇怎么错的 / 读起来卡在哪"></textarea>
    <div style="display:flex;gap:10px"><button class="btn primary" id="btn-save">保存这篇</button><button class="btn ghost" id="btn-discard">不保存</button></div>`;
  document.getElementById('btn-save').addEventListener('click', async () => {
    const now = new Date();
    const wordsArr = [...cur.words].map(k => { const el = document.querySelector(`#passage .w[data-k="${k}"]`); const s = el.closest('.s'); const [p, si] = k.split(':').map(Number); return { w: el.dataset.w, raw: el.textContent, p, s: si, sent: [...s.querySelectorAll('.w')].map(x => x.textContent).join(' ') }; });
    const sentsArr = [...cur.sents].map(k => { const s = document.querySelector(`#passage .s[data-k="${k}"]`); const [p, si] = k.split(':').map(Number); return { p, s: si, text: [...s.querySelectorAll('.w')].map(x => x.textContent).join(' ') }; });
    const id = cur.text.id + '__' + now.toISOString().replace(/[-:T]/g, '').slice(0, 12);
    const doc = { id, textId: cur.text.id, label: cur.text.label, year: cur.text.id.split('-')[0] * 1, startedAt: new Date(cur.startedAt).toISOString(), submittedAt: now.toISOString(), durationSec: Math.round(cur.durationSec), score, answers: cur.answers, correct, qTimes: Object.fromEntries(Object.entries(cur.qTimes).map(([k, v]) => [k, Math.round(v)])), causes: cur.causes, note: document.getElementById('note').value.trim(), words: wordsArr, sentences: sentsArr };
    document.getElementById('btn-save').disabled = true;
    await saveAttempt(doc);
    cur = null; render(); openDetail(id);
  });
  document.getElementById('btn-discard').addEventListener('click', () => { if(confirm('不保存这次作答？')){ cur = null; show('home'); render(); } });
  r.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
document.getElementById('btn-back').addEventListener('click', () => { if(cur && cur.started && !cur.submitted && !confirm('这篇还没提交，离开会丢掉本次作答。确定离开？')) return; clearInterval(tick); cur = null; show('home'); render(); });

// ---------- history ----------
function renderHistory(){
  const el = document.getElementById('hlist'); const list = Object.values(attempts).sort((a, b) => a.submittedAt < b.submittedAt ? 1 : -1);
  if(!list.length){ el.innerHTML = '<div class="empty">还没有记录。去题库做第一篇。</div>'; return; }
  el.innerHTML = '';
  list.forEach(a => {
    const b = document.createElement('button'); b.className = 'hrow';
    b.innerHTML = `<span><span style="font-weight:600">${a.label}</span><br><span class="d">${fmtDate(a.submittedAt)}${a.note ? ' · ' + esc(a.note) : ''}</span></span><span class="d d2 num">${a.words.length} 词 · ${a.sentences.length} 句</span><span class="d d2 num">${fmt(a.durationSec)}</span>${scorePill(a)}`;
    b.addEventListener('click', () => openDetail(a.id));
    el.appendChild(b);
  });
}
function openDetail(id){
  const a = attempts[id]; const t = byId[a.textId]; if(!t) return; detailId = id;
  document.getElementById('d-label').textContent = a.label;
  document.getElementById('d-kv').innerHTML = `<dt>做于</dt><dd>${fmtDate(a.submittedAt)}</dd><dt>得分</dt><dd>${a.score} / 5</dd><dt>用时</dt><dd class="num">${fmt(a.durationSec)}</dd><dt>标记</dt><dd>${a.words.length} 个词、${a.sentences.length} 句</dd>${a.note ? `<dt>备注</dt><dd>${esc(a.note)}</dd>` : ''}`;
  renderPassage(document.getElementById('d-passage'), t, { words: new Set(), sents: new Set(a.sentences.map(s => `${s.p}:${s.s}`)) });
  // words: re-attach marks by matching the saved token inside its sentence
  const pEl = document.getElementById('d-passage');
  a.words.forEach(w => { const s = pEl.querySelector(`.s[data-k="${w.p}:${w.s}"]`); if(!s) return; const cand = [...s.querySelectorAll('.w')].find(x => x.textContent === w.raw && !x.classList.contains('unk')) || [...s.querySelectorAll('.w')].find(x => x.dataset.w === w.w); if(cand) cand.classList.add('unk'); });
  renderQs(document.getElementById('d-qs'), t, a, false);
  show('detail');
}
document.getElementById('btn-back2').addEventListener('click', () => { show('history'); render(); });
let detailId = null;
document.getElementById('btn-copy-md').addEventListener('click', () => { if(detailId && attempts[detailId]) copyText(attemptMarkdown(attempts[detailId])); });

// ---------- vocab ----------
function renderVocab(){
  const tb = document.getElementById('vtable'); const agg = {};
  Object.values(attempts).forEach(a => a.words.forEach(w => { if(!w.w) return; const k = w.w; agg[k] = agg[k] || { n: 0, ctx: w.sent, from: new Set() }; agg[k].n++; agg[k].from.add(a.label); }));
  const rows = Object.entries(agg).sort((x, y) => y[1].n - x[1].n || x[0].localeCompare(y[0]));
  if(!rows.length){ tb.innerHTML = '<tr><td class="empty">还没有生词。做题时点一下不认识的词，它们会汇总到这里。</td></tr>'; return; }
  tb.innerHTML = '<tr><th>词</th><th>次</th><th>出处 · 句子</th></tr>' + rows.map(([w, v]) => `<tr><td class="wd">${esc(w)}</td><td class="num">${v.n}</td><td class="ctx"><span class="small muted" style="font-family:'IBM Plex Sans',sans-serif">${[...v.from].join('、')}</span><br>${esc(v.ctx)}</td></tr>`).join('');
}

function render(){ renderHome(); renderHistory(); renderVocab(); }
load();
render();
ghPull();
</script>
